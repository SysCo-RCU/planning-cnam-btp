# Passage unique : renomme « calendrier .pdf » (espace ajouté à l'envoi) en « calendrier.pdf ».
# Ce fichier sera supprimé juste après.
name: Renommer le calendrier PDF

on:
  push:
    paths: ['.github/workflows/renommer.yml']

permissions:
  contents: write

jobs:
  renommer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv "calendrier .pdf" calendrier.pdf
          git commit -m "Calendrier PDF : nom attendu par la page (calendrier.pdf)"
          git pull --rebase origin main
          git push
